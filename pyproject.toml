[project]
name = "learning-notebooks"
version = "0.1.0"
description = "Learning series for Python libraries via marimo notebooks."
readme = "README.md"
requires-python = ">=3.13,<4.0"

# No runtime dependencies on purpose: every notebook carries its own
# dependencies via PEP 723 inline script metadata and runs sandboxed.
dependencies = []

[dependency-groups]
dev = [
  ### Notebooks ###
  "marimo",
  ### Lint ###
  "ruff>=0.16.0",
  "ty",
]

[tool.ruff]
target-version = "py313"
line-length = 100  # Following cpython conventions for educational content

[tool.ruff.lint]
# `select` is deliberately unset: ruff 0.16 enables a curated default rule
# set, and an explicit `select` would replace it rather than extend it.
# `extend-select` layers this project's additional linters on top.
extend-select = [
  "E", # pycodestyle
  "F", # pyflakes
  "I", # isort
  "UP", # pyupgrade
  "A", # flake8-builtins
  "B", # flake8-bugbear
  "C4", # flake8-comprehensions
  "COM", # flake8-commas
  "EM", # flake8-errmsg
  "Q", # flake8-quotes
  "PTH", # flake8-use-pathlib
  "SIM", # flake8-simplify
  "TRY", # Tryceratops
  "PERF", # Perflint
  "RUF", # Ruff-specific rules
  "D", # pydocstyle
]
ignore = [
  "COM812", # missing trailing comma, ruff format conflict
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# marimo notebooks: cells are generated functions; the last expression in a
# cell is its rendered output, and imports are shared across cells via returns.
"notebooks/**/*.py" = [
  "B018", # "useless expression" — bare expressions are marimo cell outputs
  "D", # docstring rules don't fit generated cell functions
  "E501", # long lines in mo.md() blocks and source-reading URLs
  "PLR1711", # marimo's codegen closes every cell function with a bare return
]
"notes/notebook_template.py" = [
  "B018",
  "D",
  "E501",
  "PLR1711",
]
# tests: docstrings on every test add noise; private-symbol access is the point.
"tests/**/*.py" = [
  "D", # test names are the documentation
  "SLF001", # tests legitimately reach into _private helpers
]

[tool.ty.src]
include = ["notebooks", "notes", "scripts"]

# ty ignores `[tool.ty]` rules for PEP 723 scripts; the notebook ignores are
# passed in the workflow instead.
